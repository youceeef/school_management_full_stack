services:
  - type: web
    name: eduspace-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_NAME
        value: EduSpace
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          name: eduspace-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "1440"
      - key: HEALTH_CACHE_SECONDS
        value: "60"
      - key: API_SCHEMA_VERSION
        value: "1"
      - key: UPLOADS_DISK
        value: profile_s3
      - key: DOCUMENTS_DISK
        value: documents_s3
      - key: PROFILE_AWS_ACCESS_KEY_ID
        sync: false
      - key: PROFILE_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: PROFILE_AWS_DEFAULT_REGION
        value: eu-central-1
      - key: PROFILE_AWS_BUCKET
        sync: false
      - key: PROFILE_AWS_URL
        sync: false
      - key: PROFILE_AWS_ENDPOINT
        sync: false
      - key: PROFILE_AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: DOCUMENTS_AWS_ACCESS_KEY_ID
        sync: false
      - key: DOCUMENTS_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DOCUMENTS_AWS_DEFAULT_REGION
        value: eu-central-1
      - key: DOCUMENTS_AWS_BUCKET
        sync: false
      - key: DOCUMENTS_AWS_ENDPOINT
        sync: false
      - key: DOCUMENTS_AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FIRST_NAME
        value: Admin
      - key: ADMIN_LAST_NAME
        value: User
      - key: MAIL_MAILER
        value: mailjet
      - key: MAILJET_APIKEY
        sync: false
      - key: MAILJET_APISECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: EduSpace

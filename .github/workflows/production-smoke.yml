name: Production Smoke

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected production commit SHA (defaults to current main)
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify synchronized production deployments
        run: npm run smoke:production
        env:
          PRODUCTION_FRONTEND_URL: https://eduspace-alpha.vercel.app
          PRODUCTION_API_URL: https://eduspace-api-dhn4.onrender.com
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}
          EXPECTED_API_SCHEMA_VERSION: "1"
          MAX_ATTEMPTS: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && '45' || '1' }}
          RETRY_DELAY_MS: "20000"
